<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age of Empires 2 - Mi Colección</title>
    <style>
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e; 
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        
        h1 { 
            color: #00fff5; /* Letras color cyan neón */
            text-shadow: 0 0 10px #00fff580;
        }

        /* Estilo de la "Caja" donde va el juego */
        .game-container {
            max-width: 800px; /* Ancho máximo del juego */
            margin: 0 auto; /* Centrar la caja */
            background-color: #16213e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); /* Sombra para que resalte */
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 8px;
            background-color: #000; 
        }
        
        .fullscreen-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #e94560; 
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .fullscreen-btn:hover {
            background-color: #ff5270; /* Brillo al pasar el ratón */
        }
    </style>
</head>
<body>

    <h1>⚔️ Age of Empires 2</h1>
    <p>Disfruta de este clásico directamente en tu navegador.</p>

    <div class="game-container">
        
        <iframe id="game-frame" src="https://dos.zone/age-of-empires2/" allowfullscreen></iframe>

        <button class="fullscreen-btn" onclick="hacerPantallaCompleta()">🔲 Jugar en Pantalla Completa</button>
    </div>

    <!-- Script (JavaScript) para que funcione el botón de pantalla completa -->
    <script>
        function hacerPantallaCompleta() {
            var iframe = document.getElementById("game-frame");
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) { /* Chrome, Safari & Opera */
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) { /* IE/Edge */
                iframe.msRequestFullscreen();
            }
        }
    </script>

</body>
</html>
